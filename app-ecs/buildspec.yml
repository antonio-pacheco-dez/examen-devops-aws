version: 0.2

env:
  variables:
    DEPLOY_REF: "rel-62ee8d"

phases:
  pre_build:
    commands:
      - echo "Autenticando en Amazon ECR..."
      - AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - ECR_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${ECR_REPO_NAME}"
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_TAG="1.0.0-${CODEBUILD_BUILD_NUMBER}-${COMMIT_HASH}"

  build:
    commands:
      - cd app-ecs
      - echo "Construyendo imagen Docker con tag inmutable ${IMAGE_TAG}..."
      - docker build --build-arg BUILD_ID=${COMMIT_HASH} -t ${ECR_URI}:${IMAGE_TAG} .

  post_build:
    commands:
      - echo "Publicando imagen en Amazon ECR..."
      - docker push ${ECR_URI}:${IMAGE_TAG}
      - echo "Generando imagedefinitions.json en la raiz..."
      - cd $CODEBUILD_SRC_DIR
      - printf '[{"name":"%s","imageUri":"%s"}]' "${CONTAINER_NAME}" "${ECR_URI}:${IMAGE_TAG}" > imagedefinitions.json
      - cat imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
